[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "master_config_client"
version = "0.1.0"
description = "Client library for the Master Configuration REST API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "responses>=0.25.0",
]
